cat << 'EOF' > .github/workflows/ci.yml
name: CI 커밋 체크 파이프라인

# 언제 이 로봇을 깨울 것인가?
on:
  pull_request:
    branches: [ "main" ] # main 브랜치를 향해 PR이 열릴 때마다 가동!

# 로봇이 해야 할 일 목록
jobs:
  build-and-test:
    runs-on: ubuntu-latest # 가상 우분투 컴퓨터 한 대 빌려서 실행해라

    steps:
    # 1. 우리가 올린 소스코드를 가상 컴퓨터로 다운로드(Checkout)
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    # 2. 실무에서 돌리는 자동 검증 가상 시나리오 (맛보기)
    - name: 시스템 환경 검증 및 모의 테스트
      run: |
        echo "=== [GitHub Actions] 자동 검증 프로세스 가동 ==="
        echo "현재 디렉토리 파일 목록:"
        ls -la
        echo "service.txt 파일 내부 검사:"
        cat service.txt
        echo "=== 모든 테스트가 성공적으로 통과되었습니다! ==="
EOF
